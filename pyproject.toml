[project]
name = "comfyui-simple-ollama"
description = "AB Ollama sends a prompt and optional images to any Ollama server (local or LAN) and returns text: vision, IMAGE batches, thinking mode, model list via Connect. No extra pip packages."
version = "1.3.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/a-und-b/ComfyUI_Simple_Ollama"
Documentation = "https://github.com/a-und-b/ComfyUI_Simple_Ollama/blob/main/README.md"
"Bug Tracker" = "https://github.com/a-und-b/ComfyUI_Simple_Ollama/issues"

[tool.comfy]
PublisherId = "a-und-b"
DisplayName = "AB Simple Ollama"
Icon = ""
